[plugin]
id = "kongxiang_incremental"
name = "空想增量"
description = "在插件面板里玩《空想增量》：猫咪可以读取游戏快照并替你排操作。"
short_description = "Play Kongxiang Incremental inside the plugin panel; the cat can read the snapshot and queue actions."
keywords = ["游戏", "game", "incremental", "放置", "空想增量", "kongxiang"]
version = "0.1.0"
entry = "plugin.plugins.kongxiang_incremental:KongxiangPlugin"

[plugin.author]
name = "dawn-of-star"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
