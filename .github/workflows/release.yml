name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: plugin-repo

      - name: Checkout N.E.K.O
        uses: actions/checkout@v4
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: main
          path: neko

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Mount plugin into N.E.K.O
        run: |
          set -euo pipefail
          rm -rf neko/plugin/plugins/kongxiang_incremental
          mkdir -p neko/plugin/plugins
          cp -r plugin-repo neko/plugin/plugins/kongxiang_incremental
          rm -rf neko/plugin/plugins/kongxiang_incremental/.git

      - name: Build plugin package
        working-directory: neko
        run: |
          set -euo pipefail
          mkdir -p plugin/neko_plugin_cli/target
          uv run python -m plugin.neko_plugin_cli.cli check -r kongxiang_incremental

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            neko/plugin/neko_plugin_cli/target/kongxiang_incremental.neko-plugin
